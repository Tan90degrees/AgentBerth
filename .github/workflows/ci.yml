name: CI and Windows packages
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: agentberth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dependencies
      - name: Cache Linux CJK test font
        if: runner.os == 'Linux'
        id: cjk-font
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts/agentberth-ci
          key: ${{ runner.os }}-agentberth-wqy-microhei-v1
      - name: Prepare Linux CJK test font
        if: runner.os == 'Linux' && steps.cjk-font.outputs.cache-hit != 'true'
        run: |
          font_package_dir="$(mktemp -d)"
          trap 'rm -rf "$font_package_dir"' EXIT
          cd "$font_package_dir"
          if ! apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 download fonts-wqy-microhei; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq
            apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 download fonts-wqy-microhei
          fi
          dpkg-deb --extract ./fonts-wqy-microhei_*.deb extracted
          install -Dm644 extracted/usr/share/fonts/truetype/wqy/wqy-microhei.ttc "$HOME/.local/share/fonts/agentberth-ci/wqy-microhei.ttc"
        timeout-minutes: 3
      - name: Refresh Linux CJK font cache
        if: runner.os == 'Linux'
        run: fc-cache -f "$HOME/.local/share/fonts/agentberth-ci"
        timeout-minutes: 2
      - name: Prepare dependency-free SSH integration (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y --no-upgrade --no-install-recommends openssh-server
          fi
          bash scripts/setup-ssh-test.sh
        timeout-minutes: 5
      - run: npm run check
        timeout-minutes: 8
      - name: Workbench smoke (Linux)
        id: desktop-linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.mjs
        timeout-minutes: 5
        env:
          DEBUG: pw:browser
      - name: File preview smoke (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && (steps.desktop-linux.outcome == 'success' || steps.desktop-linux.outcome == 'failure') }}
        run: xvfb-run -a node scripts/smoke-files.mjs
        timeout-minutes: 5
        env:
          DEBUG: pw:browser
      - name: Workbench smoke (Windows)
        id: desktop-windows
        if: runner.os == 'Windows'
        run: node scripts/smoke.mjs
        timeout-minutes: 5
        env:
          DEBUG: pw:browser
      - name: File preview smoke (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.desktop-windows.outcome == 'success' || steps.desktop-windows.outcome == 'failure') }}
        run: node scripts/smoke-files.mjs
        timeout-minutes: 5
        env:
          DEBUG: pw:browser
      - name: Desktop pet smoke (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && (steps.desktop-linux.outcome == 'success' || steps.desktop-linux.outcome == 'failure') }}
        run: xvfb-run -a node scripts/smoke-pet.mjs
        timeout-minutes: 2
      - name: Desktop pet smoke (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.desktop-windows.outcome == 'success' || steps.desktop-windows.outcome == 'failure') }}
        run: node scripts/smoke-pet.mjs
        timeout-minutes: 3
      - name: Cordis plugin smoke (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' && (steps.desktop-linux.outcome == 'success' || steps.desktop-linux.outcome == 'failure') }}
        run: xvfb-run -a node scripts/smoke-extensions.mjs
        timeout-minutes: 2
      - name: Cordis plugin smoke (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' && (steps.desktop-windows.outcome == 'success' || steps.desktop-windows.outcome == 'failure') }}
        run: node scripts/smoke-extensions.mjs
        timeout-minutes: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ runner.os }}
          path: test-results/*.png
          if-no-files-found: ignore
  windows-package:
    name: Windows x64 installer and ZIP
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-dependencies
        timeout-minutes: 10
      - name: Cache Windows packaging tools
        uses: actions/cache@v4
        with:
          path: .cache/electron-builder
          key: windows-builder-v1-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Check types and setup scripts
        run: npm run typecheck && npm run test:scripts
      - name: Build installer and unpack-and-run ZIP
        id: package
        run: npm run dist:win -- --config.electronDist=node_modules/electron/dist
        timeout-minutes: 10
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      - name: Test installer progress, cancellation and upgrade
        id: installer-smoke
        run: ./scripts/test-installer.ps1
        shell: powershell
        timeout-minutes: 6
      - name: Test packaged application with real terminal
        id: packaged-smoke
        run: node scripts/smoke.mjs --packaged
        timeout-minutes: 5
        env:
          DEBUG: pw:browser
      - name: Test packaged file preview and Git
        id: packaged-files-smoke
        if: ${{ !cancelled() && (steps.packaged-smoke.outcome == 'success' || steps.packaged-smoke.outcome == 'failure') }}
        run: node scripts/smoke-files.mjs --packaged
        timeout-minutes: 5
        env:
          DEBUG: pw:browser
      - name: Test packaged desktop pet and hooks
        id: packaged-pet-smoke
        if: ${{ !cancelled() && (steps.packaged-smoke.outcome == 'success' || steps.packaged-smoke.outcome == 'failure') }}
        run: node scripts/smoke-pet.mjs --packaged
        timeout-minutes: 2
      - name: Test packaged Cordis plugins
        id: packaged-extensions-smoke
        if: ${{ !cancelled() && (steps.packaged-smoke.outcome == 'success' || steps.packaged-smoke.outcome == 'failure') }}
        run: node scripts/smoke-extensions.mjs --packaged
        timeout-minutes: 2
      - name: Write checksums and build information
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        env:
          PACKAGED_WORKBENCH_RESULT: ${{ steps.packaged-smoke.outcome }}
          PACKAGED_FILES_RESULT: ${{ steps.packaged-files-smoke.outcome }}
          PACKAGED_PET_RESULT: ${{ steps.packaged-pet-smoke.outcome }}
          PACKAGED_EXTENSIONS_RESULT: ${{ steps.packaged-extensions-smoke.outcome }}
          INSTALLER_SMOKE_RESULT: ${{ steps.installer-smoke.outcome }}
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          if ($files.Count -ne 2) { throw 'Expected one installer and one ZIP' }
          $checksums = $files | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content release/SHA256SUMS.txt -Encoding utf8
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $packagedSmokeResult = if ($env:PACKAGED_WORKBENCH_RESULT -eq 'success' -and $env:PACKAGED_FILES_RESULT -eq 'success' -and $env:PACKAGED_PET_RESULT -eq 'success' -and $env:PACKAGED_EXTENSIONS_RESULT -eq 'success') { 'success' } else { 'failure' }
          @{ version = $version; commit = $env:GITHUB_SHA; ref = $env:GITHUB_REF_NAME; packagedSmoke = $packagedSmokeResult; packagedSuites = @{ workbench = $env:PACKAGED_WORKBENCH_RESULT; files = $env:PACKAGED_FILES_RESULT; pet = $env:PACKAGED_PET_RESULT; extensions = $env:PACKAGED_EXTENSIONS_RESULT }; installerSmoke = $env:INSTALLER_SMOKE_RESULT; run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" } |
            ConvertTo-Json | Set-Content release/build-info.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: installer-payload-inventory
          path: dist/installer-payload.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: AgentBerth-Windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
            release/build-info.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-packaged-Windows
          path: test-results/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-smoke-Windows
          path: test-results/installer/
          if-no-files-found: ignore
  release:
    name: Publish verified release
    needs: [check, windows-package]
    if: github.repository == 'Tan90degrees/AgentBerth' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AgentBerth-Windows-x64
          path: release
      - name: Verify packages and publish release
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = await import('node:url');
            const { publishRelease } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release.mjs`).href);
            const result = await publishRelease({ github, context, core }, process.env.GITHUB_WORKSPACE, `${process.env.GITHUB_WORKSPACE}/release`);
            await core.summary.addHeading(result.skipped ? 'Release already published' : 'Release published').addLink('Open release', result.url).write();
