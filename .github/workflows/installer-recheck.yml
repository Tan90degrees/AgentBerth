name: Diagnose Windows installer
on:
  push:
    branches: [diagnostics/installer-recheck]
  workflow_dispatch:
    inputs:
      package_run_id:
        description: CI run containing the Windows package and payload inventory
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AgentBerth-Windows-x64
          path: release
          run-id: ${{ inputs.package_run_id || '38894889223' }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install builder without Electron download or native rebuild
        run: npm ci --ignore-scripts
        timeout-minutes: 4
      # Legacy run predates the separate inventory artifact. Reconstruct its
      # physical payload from the accompanying ZIP, excluding builder's later
      # elevation helper, then assert the recorded embedded inventory totals.
      - name: Recover legacy inventory from the accompanying ZIP
        shell: python
        run: |
          import hashlib, json, pathlib, zipfile
          archive = next(pathlib.Path('release').glob('*.zip'))
          files = []
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  if entry.is_dir() or entry.filename == 'resources/elevate.exe':
                      continue
                  with z.open(entry) as f:
                      digest = hashlib.file_digest(f, 'sha256').hexdigest()
                  files.append(dict(path=entry.filename, size=entry.file_size, sha256=digest))
          assert len(files) == 372, len(files)
          assert sum(f['size'] for f in files) == 440761047
          pathlib.Path('dist').mkdir(exist_ok=True)
          pathlib.Path('dist/installer-payload.json').write_text(json.dumps(dict(version=1, files=files)), encoding='utf-8')
      - name: Extract existing packaged application
        shell: python
        run: |
          import pathlib, zipfile
          with zipfile.ZipFile(next(pathlib.Path('release').glob('*.zip'))) as archive:
              archive.extractall('.installer-recheck')
      - name: Trace the exact file rejected by upstream atomic cleanup
        shell: python
        run: |
          import pathlib
          template = pathlib.Path('node_modules/app-builder-lib/templates/nsis/uninstaller.nsh')
          source = template.read_text(encoding='utf-8')
          needle = 'DetailPrint "File is busy, aborting: $R0"'
          assert needle in source
          source = source.replace(needle, '!insertmacro BerthLog "FAILED: cannot move installed file: $R0"')
          template.write_text(source, encoding='utf-8')
      - name: Rebuild only the instrumented installer
        run: npx electron-builder --prepackaged .installer-recheck --win nsis --x64 --publish never
        timeout-minutes: 4
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_7Z_FILTER: BCJ
      - name: Check package version and record provenance
        shell: pwsh
        run: |
          $build = Get-Content release/build-info.json -Raw | ConvertFrom-Json
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($build.version -ne $version) { throw 'Package version differs from the checked-out test script' }
          "Package commit: $($build.commit); test commit: $env:GITHUB_SHA" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Test installer with Win32 long-path policy disabled
        shell: powershell
        timeout-minutes: 6
        run: |
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $previous = (Get-ItemProperty $key).LongPathsEnabled
          try {
            Set-ItemProperty $key LongPathsEnabled 0
            ./scripts/test-installer.ps1
          } finally { Set-ItemProperty $key LongPathsEnabled $previous }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-recheck-Windows
          path: test-results/installer/
          if-no-files-found: ignore
