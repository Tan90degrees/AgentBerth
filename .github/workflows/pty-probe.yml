name: Isolated Windows PTY diagnosis
on:
  push:
    branches: [diagnostics/windows-pty]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/probe-windows-pty.mjs
        timeout-minutes: 3
