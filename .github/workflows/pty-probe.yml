name: Isolated Windows PTY diagnosis
on:
  push:
    branches: [diagnostics/windows-pty]
permissions:
  contents: read
jobs:
  packaged:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --dir --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:packaged
        timeout-minutes: 5
        env:
          BERTH_USE_BUNDLED: '0'
          BERTH_PTY_TRACE: ${{ github.workspace }}/pty-trace.log
          DEBUG: pw:browser
      - run: Get-Content pty-trace.log
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pty-diagnosis-packaged
          path: |
            pty-trace.log
            test-results/*.png
