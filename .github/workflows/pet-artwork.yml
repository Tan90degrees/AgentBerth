name: Rebuild desktop pet artwork
on:
  push:
    branches: [fix/ssh-control-ownership]
    paths: [assets/pet/source.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artwork:
    if: github.repository == 'Tan90degrees/AgentBerth' && github.ref == 'refs/heads/fix/ssh-control-ownership'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Encode the pinned MIT character animations
        run: python scripts/build-pet-assets.py
      - name: Commit generated assets to the same development branch
        env:
          ARTWORK_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/pet-assets tests/fixtures/pet-*.gif
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Replace geometric default pet with licensed illustrated 24 fps animations with soft transparent edges"
          git push origin "HEAD:$ARTWORK_BRANCH"
