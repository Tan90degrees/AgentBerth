name: Linux server packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentberth-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Package and test Linux server (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install build dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Build headless Linux package
        run: |
          export AGENTBERTH_SERVER_NODE_LICENSE="$(dirname "$(command -v node)")/../LICENSE"
          test -s "$AGENTBERTH_SERVER_NODE_LICENSE"
          npm run dist:server
      - name: Verify release archive and workspace connections
        run: |
          cd release
          sha256sum -c AgentBerth-Server-*-linux-*.tar.gz.sha256
          tar -xzf AgentBerth-Server-*-linux-*.tar.gz
          test -x agentberth-server/bin/node
          test -s agentberth-server/LICENSE.node
          env PATH=/usr/bin:/bin agentberth-server/bin/agentberth-server --help
          cd ..
          node scripts/test-server.mjs release/agentberth-server
      - uses: actions/upload-artifact@v4
        with:
          name: AgentBerth-Server-Linux-${{ matrix.arch }}
          path: |
            release/AgentBerth-Server-*.tar.gz
            release/AgentBerth-Server-*.tar.gz.sha256
          if-no-files-found: error
  desktop:
    name: Desktop to Linux server
    needs: server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dependencies
      - name: Build AgentBerth
        run: npm run typecheck && npm run build
      - uses: actions/download-artifact@v4
        with:
          name: AgentBerth-Server-Linux-x64
          path: release
      - name: Prepare local SFTP fixture
        run: |
          if [ ! -x /usr/lib/openssh/sftp-server ]; then
            sudo apt-get -o Acquire::Retries=2 update -qq
            sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends openssh-sftp-server
          fi
      - name: Verify SSH authentication, provisioning and session persistence
        run: node --test scripts/test-server-provision.mjs
        timeout-minutes: 2
        env:
          AGENTBERTH_TEST_REMOTE_PATH: /usr/bin:/bin
      - name: Verify SSH and direct workspace connections in Electron
        run: |
          xvfb-run -a node scripts/smoke-server-desktop.mjs
          xvfb-run -a node scripts/smoke-server-ssh.mjs
        timeout-minutes: 4
        env:
          AGENTBERTH_TEST_REMOTE_PATH: /usr/bin:/bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-server-desktop
          path: test-results/server-*.png
          if-no-files-found: ignore
